services:
  - type: web
    name: ksc-carpets-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SHEETS_WEBAPP_URL
        sync: false
      - key: SHEETS_WEBAPP_SECRET
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: BUSINESS_NAME
        value: KSC Carpets
      - key: BUSINESS_GOOGLE_REVIEW_LINK
        sync: false
      - key: BUSINESS_WEBSITE
        value: https://www.ksc-carpets.com
      - key: DATA_DIR
        value: /var/data
      - key: AUTH_DIR
        value: /var/data/auth_info
      # Instagram DM bot (igramapi - logs in as the account, no Meta app).
      # Leave these unset and the app runs WhatsApp-only, with the Instagram
      # section showing as "not set up".
      - key: IG_USERNAME
        sync: false
      - key: IG_PASSWORD
        sync: false
      # Must sit on the persistent disk, or every deploy is a fresh login -
      # which is what gets an Instagram account checkpointed.
      - key: IG_SESSION_DIR
        value: /var/data/ig_session
      # A residential proxy. Instagram treats logins from Render's IPs as
      # suspicious; this is the single biggest factor in not getting banned.
      - key: IG_PROXY
        sync: false
      - key: IG_POLL_SECONDS
        value: "60"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
