<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Automation console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #16302b; --ink-soft: #5f726d; --rule: #d8dfdc; --stop: #a32b22; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
    background: var(--ink); color: var(--ink);
  }
  form { background: #fff; border-radius: 12px; padding: 30px 28px; width: 100%; max-width: 352px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 3px; }
  p { font-size: 14.5px; color: var(--ink-soft); margin: 0 0 22px; line-height: 1.5; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 7px;
    font: inherit; font-size: 15px; background: #fbfcfc; margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: var(--ink); background: #fff; }
  button {
    width: 100%; padding: 11px; border: none; background: var(--ink); color: #fff;
    border-radius: 7px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #0d211d; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .error {
    display: none; border: 1px solid #e7bfbc; background: #fbeeed; color: var(--stop);
    border-radius: 7px; padding: 9px 12px; font-size: 14px; margin-bottom: 16px;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <form method="POST" action="/login">
    <h1>Automation console</h1>
    <p>Sign in to see what the bots are doing.</p>
    <div class="error" id="err">That password did not match. Try again.</div>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
    <button type="submit">Sign in</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('err').classList.add('show');
    }
  </script>
</body>
</html>
